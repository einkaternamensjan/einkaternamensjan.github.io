<!doctype html>
<!-- template-version: 8 -->
<html lang="de" class="theme-light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Index - einkaternamensjan</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="styles.css?v=8">
  <script>
    /* Thema vor dem ersten Zeichnen setzen, sonst blitzt Weiß auf.
       Liest localStorage und, falls der gesperrt ist, den Cookie. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('ekj-theme'); } catch (e) {}
      if (t === null) {
        var m = document.cookie.match('(?:^|; )ekj-theme=([^;]*)');
        if (m) t = decodeURIComponent(m[1]);
      }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark' : 'light';
      }
      document.documentElement.className = 'theme-' + t;
    })();
  </script>
</head>

  </div>

</body>
