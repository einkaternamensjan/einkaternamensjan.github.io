<html lang="de" class="theme-light">

  <link rel="stylesheet" href="styles.css?v=8">
  <script>
    /* Thema vor dem ersten Zeichnen setzen, sonst blitzt Weiß auf.
       Liest localStorage und, falls der gesperrt ist, den Cookie. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('ekj-theme'); } catch (e) {}
      if (t === null) {
        var m = document.cookie.match('(?:^|; )ekj-theme=([^;]*)');
        if (m) t = decodeURIComponent(m[1]);
      }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark' : 'light';
      }
      document.documentElement.className = 'theme-' + t;
    })();
  </script>
</head>
<body class="view-parallel home" style="--accent:#2F4A38;--band-fg:#FFFFFF;--accent-ink-l:#2F4A38;--accent-ink-d:#78897E">

  <script>
    (function () {
      var apply = function (lang) {
        document.querySelectorAll('.translatable').forEach(function (el) {
          var text = el.getAttribute('data-' + lang);
          if (text !== null) el.textContent = text;
        });
      };

      var setLang = function (lang) {
        document.documentElement.lang = (lang === 'de') ? 'de' : 'en';
        apply(lang);
        document.getElementById('btn-de').setAttribute('aria-pressed', String(lang === 'de'));
        document.getElementById('btn-en').setAttribute('aria-pressed', String(lang === 'en'));
        try { localStorage.setItem('ekj-home-lang', lang); } catch (e) { /* ignore */ }
      };

      document.getElementById('btn-de').addEventListener('click', function () { setLang('de'); });
      document.getElementById('btn-en').addEventListener('click', function () { setLang('en'); });

      var stored = null;
      try { stored = localStorage.getItem('ekj-home-lang'); } catch (e) { /* ignore */ }
      var browser = (navigator.language || 'de').toLowerCase().indexOf('de') === 0 ? 'de' : 'en';
      setLang(stored === 'de' || stored === 'en' ? stored : browser);
    })();
  </script>
